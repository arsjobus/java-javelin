name: Build and release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must match vX.Y.Z (for example v1.2.3)." >&2
            exit 1
          fi

  build-macos:
    needs: validate-tag
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build macOS app and DMG
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}" packaging/macos/build-app.sh
          jpackage \
            --type dmg \
            --name "Javelin IDE" \
            --app-image "dist/Javelin IDE.app" \
            --dest dist
          mv dist/*.dmg "dist/Javelin-IDE-${GITHUB_REF_NAME#v}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  build-windows:
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build Windows MSI
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: .\packaging\windows\build-installer.ps1 -AppVersion "$($env:TAG.Substring(1))"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/* --title "Javelin IDE $TAG" --generate-notes
